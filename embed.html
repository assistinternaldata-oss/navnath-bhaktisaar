<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Shri Darshan video</title>
  <!-- Used by the Android/iOS apps: YouTube only plays embeds that come from a website,
       so the apps show this page, which shows the YouTube player. -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <script>
    const id = (new URLSearchParams(location.search).get('v') || '').replace(/[^\w-]/g, '').slice(0, 11);
    if (id.length === 11) {
      const f = document.createElement('iframe');
      f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
      f.title = 'YouTube';
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
      f.allowFullscreen = true;
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      document.body.append(f);
    }
  </script>
</body>
</html>
